<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#232f3e">End-to-End Flow: Serve → Optimize → Customize → Scale</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a6ebb"/></marker></defs>

  <rect x="340" y="52" width="150" height="46" rx="8" fill="#fdeeee" stroke="#d62728"/><text x="415" y="75" text-anchor="middle">S3: Ministral-3-8B</text><text x="415" y="91" text-anchor="middle" fill="#a00">9.7 GiB weights</text>

  <!-- Serve -->
  <rect x="60" y="130" width="150" height="56" rx="8" fill="#eef7ee" stroke="#2ca02c" stroke-width="2"/><text x="135" y="153" text-anchor="middle" font-weight="bold">100 vLLM</text><text x="135" y="172" text-anchor="middle" fill="#555">live API + chat UI</text>
  <rect x="60" y="210" width="150" height="56" rx="8" fill="#fff3e8" stroke="#ff7f0e" stroke-width="2"/><text x="135" y="233" text-anchor="middle" font-weight="bold">200 Agent</text><text x="135" y="252" text-anchor="middle" fill="#b35300">tool calling (core)</text>

  <!-- Optimize -->
  <rect x="250" y="130" width="150" height="56" rx="8" fill="#eef7ee" stroke="#2ca02c" stroke-width="2"/><text x="325" y="153" text-anchor="middle" font-weight="bold">300 Benchmark</text><text x="325" y="172" text-anchor="middle" fill="#555">TTFT 86ms TPOT 25ms</text>
  <rect x="250" y="210" width="150" height="56" rx="8" fill="#eef7ee" stroke="#2ca02c" stroke-width="2"/><text x="325" y="233" text-anchor="middle" font-weight="bold">400 LMCache</text><text x="325" y="252" text-anchor="middle" fill="#555">L1 CPU + L2 Valkey</text>

  <!-- Customize -->
  <rect x="440" y="130" width="150" height="56" rx="8" fill="#eef7ee" stroke="#2ca02c" stroke-width="2"/><text x="515" y="153" text-anchor="middle" font-weight="bold">600 Fine-tune</text><text x="515" y="172" text-anchor="middle" fill="#555">LoRA 2.77→0.26</text>
  <rect x="440" y="210" width="150" height="56" rx="8" fill="#eef7ee" stroke="#2ca02c" stroke-width="2"/><text x="515" y="233" text-anchor="middle" font-weight="bold">700 RAG</text><text x="515" y="252" text-anchor="middle" fill="#555">S3 Vectors grounded</text>

  <!-- Scale -->
  <rect x="630" y="170" width="150" height="56" rx="8" fill="#fff3e8" stroke="#ff7f0e" stroke-width="2"/><text x="705" y="193" text-anchor="middle" font-weight="bold">800 Ray</text><text x="705" y="212" text-anchor="middle" fill="#b35300">cluster ready (serve blk)</text>

  <!-- group labels -->
  <text x="135" y="118" text-anchor="middle" font-size="11" fill="#888">SERVE</text>
  <text x="325" y="118" text-anchor="middle" font-size="11" fill="#888">OPTIMIZE</text>
  <text x="515" y="118" text-anchor="middle" font-size="11" fill="#888">CUSTOMIZE</text>
  <text x="705" y="158" text-anchor="middle" font-size="11" fill="#888">SCALE</text>

  <!-- arrows from S3 -->
  <line x1="380" y1="98" x2="150" y2="128" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="450" y1="98" x2="515" y2="128" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- flow arrows -->
  <line x1="135" y1="186" x2="135" y2="208" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="210" y1="158" x2="248" y2="158" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="325" y1="186" x2="325" y2="208" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="400" y1="158" x2="438" y2="158" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="515" y1="186" x2="515" y2="208" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="210" y1="238" x2="248" y2="238" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="400" y1="238" x2="438" y2="238" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="590" y1="198" x2="628" y2="198" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="410" y="320" text-anchor="middle" fill="#2ca02c" font-size="12">Green = fully verified end-to-end   |   Orange = core verified, one piece blocked by environment/version (documented)</text>
  <text x="410" y="344" text-anchor="middle" fill="#555" font-size="12">One base model → served, agentic, measured, memory-optimized, domain-expert, document-grounded, distributed</text>
</svg>
