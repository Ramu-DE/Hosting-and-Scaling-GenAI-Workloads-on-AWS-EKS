<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#232f3e">Module 400 — LMCache KV offloading (tiered memory)</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>

  <rect x="290" y="60" width="180" height="46" rx="8" fill="#eaf3fb" stroke="#2a6ebb"/><text x="380" y="88" text-anchor="middle">incoming request</text>
  <rect x="275" y="128" width="210" height="54" rx="8" fill="#f2f8fd" stroke="#2a6ebb" stroke-width="2"/><text x="380" y="150" text-anchor="middle" font-weight="bold">vLLM + LMCache connector</text><text x="380" y="169" text-anchor="middle" fill="#555">LMCacheConnectorV1, kv_both</text>

  <line x1="380" y1="106" x2="380" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- tiers -->
  <rect x="60" y="240" width="190" height="90" rx="8" fill="#1f77b4"/><text x="155" y="268" text-anchor="middle" fill="#fff" font-weight="bold">L0: GPU VRAM</text><text x="155" y="290" text-anchor="middle" fill="#fff">fastest, smallest</text><text x="155" y="312" text-anchor="middle" fill="#dbeaf7">NVIDIA L40S 48GB</text>
  <rect x="285" y="240" width="190" height="90" rx="8" fill="#2ca02c"/><text x="380" y="268" text-anchor="middle" fill="#fff" font-weight="bold">L1: CPU RAM</text><text x="380" y="290" text-anchor="middle" fill="#fff">LocalCPUBackend</text><text x="380" y="312" text-anchor="middle" fill="#e4f3e4">4 GB, chunk 256</text>
  <rect x="510" y="240" width="200" height="90" rx="8" fill="#ff7f0e"/><text x="610" y="264" text-anchor="middle" fill="#fff" font-weight="bold">L2: Valkey remote</text><text x="610" y="285" text-anchor="middle" fill="#fff">ElastiCache Serverless</text><text x="610" y="306" text-anchor="middle" fill="#fde6cf">rediss:// TLS (shared)</text>

  <line x1="360" y1="182" x2="200" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="230" y="214" font-size="11">hot</text>
  <line x1="380" y1="182" x2="380" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="388" y="214" font-size="11">spill</text>
  <line x1="400" y1="182" x2="580" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="500" y="214" font-size="11">spill / share across pods</text>

  <text x="40" y="372" fill="#2ca02c" font-size="12">VERIFIED: L1 "Created backend: LocalCPUBackend" + L2 "Creating Redis connector for URL: rediss://lmcache-valkey-eks-...:6379"</text>
  <text x="40" y="390" fill="#2ca02c" font-size="12">both active simultaneously (local_cpu:True + remote_url) — Valkey status: available</text>
</svg>
