  <rect x="320" y="190" width="180" height="50" rx="8" fill="#f6f0fb" stroke="#8e5bbf"/><text x="410" y="214" text-anchor="middle">Prometheus</text><text x="410" y="232" text-anchor="middle" fill="#555">scrape metrics</text>
  <rect x="320" y="262" width="180" height="50" rx="8" fill="#f6f0fb" stroke="#8e5bbf"/><text x="410" y="286" text-anchor="middle">Grafana dashboard</text><text x="410" y="304" text-anchor="middle" fill="#555">TTFT / TPOT / tps</text>
  <rect x="40" y="226" width="220" height="50" rx="8" fill="#fdeeee" stroke="#d62728"/><text x="150" y="250" text-anchor="middle">S3: benchmarks/</text><text x="150" y="268" text-anchor="middle" fill="#a00">results JSON</text>

  <line x1="410" y1="152" x2="410" y2="188" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="410" y1="240" x2="410" y2="260" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/>
