  <text x="150" y="116" text-anchor="middle" fill="#333">inference-perf v0.6.1</text>
  <text x="150" y="136" text-anchor="middle" fill="#555">synthetic: 512 in / 128 out</text>

  <rect x="320" y="78" width="180" height="74" rx="8" fill="#f2f8fd" stroke="#2a6ebb"/><text x="410" y="104" text-anchor="middle">vllm-serve-svc:8000</text><text x="410" y="124" text-anchor="middle" fill="#555">optimized vLLM</text><text x="410" y="142" text-anchor="middle" fill="#555">+ prefix caching</text>

  <rect x="560" y="78" width="175" height="74" rx="8" fill="#fff3e8" stroke="#ff7f0e"/><text x="647" y="104" text-anchor="middle">NVIDIA L40S</text><text x="647" y="128" text-anchor="middle" fill="#b35300">GPU inference</text>

  <line x1="260" y1="115" x2="318" y2="115" stroke="#2a6ebb" stroke-width="1.6" marker-end="url(#a)"/><text x="268" y="108" font-size="11">load</text>
  <line x1="500" y1="115" x2="558" y2="115" stroke="#2a6ebb" stroke-width="1.6" marker-end="url(#a)"/>

