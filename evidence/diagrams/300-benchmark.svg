<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#232f3e">Module 300 — Benchmark the LLM</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a6ebb"/></marker></defs>

  <rect x="40" y="70" width="220" height="90" rx="8" fill="#f6f0fb" stroke="#8e5bbf" stroke-width="1.5"/>
