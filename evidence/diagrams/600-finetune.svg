<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#232f3e">Module 600 — LoRA fine-tuning</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>

  <!-- training -->
  <rect x="30" y="60" width="330" height="200" rx="10" fill="#f6f0fb" stroke="#8e5bbf" stroke-width="1.5"/>
  <text x="44" y="82" font-weight="bold" fill="#8e5bbf">Training Job (PyTorch DLC, GPU)</text>
  <rect x="46" y="96" width="140" height="54" rx="6" fill="#fff" stroke="#8e5bbf"/><text x="116" y="118" text-anchor="middle">dataset.jsonl</text><text x="116" y="136" text-anchor="middle" fill="#555">200 examples</text>
  <rect x="206" y="96" width="138" height="54" rx="6" fill="#fff" stroke="#8e5bbf"/><text x="275" y="118" text-anchor="middle">base model</text><text x="275" y="136" text-anchor="middle" fill="#555">via PVC (S3)</text>
  <rect x="90" y="170" width="210" height="48" rx="6" fill="#fff" stroke="#8e5bbf"/><text x="195" y="192" text-anchor="middle">train_lora.py</text><text x="195" y="210" text-anchor="middle" fill="#555">freeze base, train adapters</text>
  <rect x="90" y="226" width="210" height="26" rx="6" fill="#eef7ee" stroke="#2ca02c"/><text x="195" y="244" text-anchor="middle" fill="#2ca02c">adapter 83 MB</text>
  <line x1="116" y1="150" x2="150" y2="168" stroke="#555" marker-end="url(#a)"/>
  <line x1="275" y1="150" x2="240" y2="168" stroke="#555" marker-end="url(#a)"/>
  <line x1="195" y1="218" x2="195" y2="224" stroke="#555" marker-end="url(#a)"/>

  <rect x="420" y="100" width="310" height="56" rx="8" fill="#fdeeee" stroke="#d62728"/><text x="575" y="124" text-anchor="middle">S3: anyvc-startup-lora/</text><text x="575" y="144" text-anchor="middle" fill="#a00">adapter_model.safetensors (67.3 MiB)</text>
  <line x1="300" y1="239" x2="418" y2="140" stroke="#2ca02c" stroke-width="1.6" marker-end="url(#a)"/><text x="330" y="200" fill="#2ca02c" font-size="11">upload</text>

  <!-- serving -->
  <rect x="420" y="200" width="310" height="150" rx="10" fill="#f2f8fd" stroke="#2a6ebb" stroke-width="1.5"/>
  <text x="434" y="222" font-weight="bold" fill="#2a6ebb">Serving: vLLM --enable-lora</text>
  <rect x="440" y="236" width="270" height="40" rx="6" fill="#fff" stroke="#2a6ebb"/><text x="575" y="261" text-anchor="middle">ministral  (base model)</text>
  <rect x="440" y="286" width="270" height="48" rx="6" fill="#eef7ee" stroke="#2ca02c"/><text x="575" y="308" text-anchor="middle" fill="#2ca02c">anyvc-startup-expert</text><text x="575" y="326" text-anchor="middle" fill="#555">adapter (parent: ministral)</text>
  <line x1="575" y1="156" x2="575" y2="198" stroke="#2a6ebb" stroke-width="1.4" marker-end="url(#a)"/><text x="582" y="182" font-size="11">S3 CSI mount</text>

  <!-- results -->
  <rect x="30" y="300" width="330" height="100" rx="8" fill="#eef7ee" stroke="#2ca02c" stroke-width="1.5"/>
  <text x="44" y="322" font-weight="bold" fill="#2ca02c">VERIFIED training</text>
  <text x="44" y="344" fill="#333">loss 2.77 → 0.26 | token acc 46% → 97.7%</text>
  <text x="44" y="364" fill="#333">5 epochs, 250 steps, 166 s on L40S</text>
  <text x="44" y="384" fill="#333">adapter answered seed-equity Q (VC advisor)</text>
</svg>
