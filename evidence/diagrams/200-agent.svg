<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#232f3e">Module 200 — Agent (tool calling)</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a6ebb"/></marker></defs>

  <!-- lifelines -->
  <text x="90" y="60" text-anchor="middle" font-weight="bold">User</text>
  <text x="280" y="60" text-anchor="middle" font-weight="bold">Strands Agent</text>
  <text x="480" y="60" text-anchor="middle" font-weight="bold">vLLM (ministral)</text>
  <text x="670" y="60" text-anchor="middle" font-weight="bold">Weather API</text>
  <line x1="90"  y1="70" x2="90"  y2="400" stroke="#ccc"/>
  <line x1="280" y1="70" x2="280" y2="400" stroke="#ccc"/>
  <line x1="480" y1="70" x2="480" y2="400" stroke="#ccc"/>
  <line x1="670" y1="70" x2="670" y2="400" stroke="#ccc"/>

  <line x1="90"  y1="100" x2="278" y2="100" stroke="#2a6ebb" stroke-width="1.5" marker-end="url(#a)"/><text x="150" y="94">"weather in Tokyo?"</text>
  <line x1="280" y1="140" x2="478" y2="140" stroke="#2a6ebb" stroke-width="1.5" marker-end="url(#a)"/><text x="330" y="134">question + tool schema</text>
  <line x1="480" y1="185" x2="282" y2="185" stroke="#ff7f0e" stroke-width="1.8" marker-end="url(#a)"/><text x="300" y="179" fill="#b35300">tool_call: current_weather("Tokyo")</text>
  <line x1="280" y1="225" x2="668" y2="225" stroke="#2a6ebb" stroke-width="1.5" marker-end="url(#a)"/><text x="430" y="219">run current_weather("Tokyo")</text>
  <line x1="670" y1="265" x2="282" y2="265" stroke="#2ca02c" stroke-width="1.5" marker-end="url(#a)"/><text x="420" y="259" fill="#2ca02c">"Partly cloudy, 22C"</text>
  <line x1="280" y1="305" x2="478" y2="305" stroke="#2a6ebb" stroke-width="1.5" marker-end="url(#a)"/><text x="310" y="299">question + tool result</text>
  <line x1="480" y1="345" x2="282" y2="345" stroke="#2ca02c" stroke-width="1.5" marker-end="url(#a)"/><text x="300" y="339" fill="#2ca02c">"Tokyo is partly cloudy, 22C"</text>
  <line x1="280" y1="385" x2="92"  y2="385" stroke="#2ca02c" stroke-width="1.5" marker-end="url(#a)"/><text x="120" y="379" fill="#2ca02c">final grounded answer</text>

  <rect x="300" y="160" width="260" height="20" fill="#fff3e8" stroke="#ff7f0e" opacity="0.25"/>
  <text x="40" y="418" fill="#2ca02c" font-size="11">VERIFIED live vs vLLM: content:null + tool_calls=[current_weather({"location":"Tokyo"})], finish_reason="tool_calls"</text>
</svg>
