---
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-baseline
  namespace: default
  labels:
    app.kubernetes.io/component: benchmark
    benchmark.scenario: baseline
data:
  config.yml: |
    api:
      type: completion
      streaming: true
    data:
      type: synthetic
      input_distribution:
        mean: 512
        std_dev: 0
        min: 512
        max: 512
      output_distribution:
        mean: 128
        std_dev: 0
        min: 128
        max: 128
    load:
      type: constant
      stages:
        - rate: 1
          duration: 60
      num_workers: 4
    server:
      type: vllm
      model_name: ministral
      base_url: http://vllm-serve-svc.default.svc.cluster.local:8000
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: mistralai/Mistral-Nemo-Instruct-2407
    storage:
      simple_storage_service:
        bucket_name: "genai-models-215808926717"
        path: "benchmarks/baseline/vllm/ministral/run001"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-baseline
  namespace: default
  labels:
    app.kubernetes.io/component: benchmark
    benchmark.scenario: baseline
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: benchmark
        benchmark.scenario: baseline
    spec:
      restartPolicy: Never
      serviceAccountName: model-storage-sa
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: inference-perf
        image: quay.io/inference-perf/inference-perf:v0.6.1
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Installing dependencies..."
          pip install --no-cache-dir "sentencepiece" "protobuf" && echo "Dependencies installed successfully"
          echo "=========================================="
          echo "Starting BASELINE Performance Test"
          echo "Target: http://vllm-serve-svc.default.svc.cluster.local:8000"
          echo "Model: ministral"
          echo "=========================================="
          inference-perf --config_file /workspace/config.yml
        env:
        - name: BENCHMARK_SCENARIO
          value: "baseline"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        volumeMounts:
        - name: config
          mountPath: /workspace/config.yml
          subPath: config.yml
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
      volumes:
      - name: config
        configMap:
          name: benchmark-baseline
